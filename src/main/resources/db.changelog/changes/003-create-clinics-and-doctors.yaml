databaseChangeLog:
  - changeSet:
      id: 003-create-clinics-and-doctors
      author: FilipEM000
      comment: "Creates the clinics table"
      changes:
        - createTable:
            tableName: clinics
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_clinics
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_clinics_name
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: postcode
                  type: VARCHAR(255)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: street_number
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: clinics

  - changeSet:
      id: 003-create-doctors-table
      author: FilipEM000
      comment: "Creates the doctors table"
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_doctors
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_doctors_user
                    references: users(id)
              - column:
                  name: specialization
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: doctors

  - changeSet:
      id: 003-create-doctor-clinic-table
      author: FilipEM000
      comment: "Creates the join table for doctor-clinic many-to-many relationship"
      changes:
        - createTable:
            tableName: doctor_clinic
            columns:
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_dc_doctor
                    references: doctors(id)
              - column:
                  name: clinic_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_dc_clinic
                    references: clinics(id)
      rollback:
        - dropTable:
            tableName: doctor_clinic
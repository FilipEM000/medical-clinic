databaseChangeLog:
  - changeSet:
      id: 004-create-visits-table
      author: FilipEM000
      comment: "Creates the visits table"
      changes:
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_visits
                    nullable: false
              - column:
                  name: start_date
                  type: TIMESTAMP
              - column:
                  name: end_date
                  type: TIMESTAMP
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_visits_patient
                    references: patients(id)
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_visits_doctor
                    references: doctors(id)
      rollback:
        - dropTable:
            tableName: visits